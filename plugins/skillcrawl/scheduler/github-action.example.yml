# Copy to .github/workflows/skillcrawl-recheck.yml in your project repo.
# Needs: ANTHROPIC_API_KEY secret, and the plugin folder available in the repo.
# The .skillcrawl/state.json file must persist between runs - this example commits it back.
name: skillcrawl-recheck
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  recheck:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm install -g @anthropic-ai/claude-code
      - run: pip install -r path/to/skillcrawl/requirements.txt
      - name: Run re-check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --plugin-dir path/to/skillcrawl -p "/skillcrawl" \
            --allowedTools "Bash" "Read" "Write"
      - name: Save state and reports
        run: |
          git config user.name "skillcrawl-bot"
          git config user.email "bot@example.com"
          git add .skillcrawl/state.json skillcrawl-reports
          git commit -m "skillcrawl recheck" || echo "nothing to commit"
          git push
